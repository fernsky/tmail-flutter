# webmail.eshasan.com — the TMail-based JMAP webmail.
#
# Serves a static Flutter bundle and nothing else. It talks JMAP directly
# to bodhimail.eshasan.com from the browser, so there is no API to proxy
# here; that origin sets permissive CORS precisely so this can be a
# separate host.

server {
    listen 80;
    listen [::]:80;
    server_name webmail.eshasan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webmail.eshasan.com;

    ssl_certificate     /etc/letsencrypt/live/webmail.eshasan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.eshasan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Attachments are uploaded straight to the JMAP origin, not through
    # here, but a generous body limit costs nothing on a static host.
    client_max_body_size 25m;

    root /opt/webmail/web;
    index index.html;

    # Serve the precompressed siblings the build produced rather than
    # compressing per request.
    gzip_static on;
    brotli_static on;

    # index.html names which immutable CDN prefix this build loads from, so
    # caching it is how a browser gets pinned to a version that no longer
    # exists. Never cache it.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Same reasoning: it decides what the app becomes on next load.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Everything else in the bundle is replaced wholesale on each deploy
    # under the same names (Flutter does not content-hash), so it cannot be
    # marked immutable at the origin — the CDN copy carries that, under a
    # per-build prefix.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
