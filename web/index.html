<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bodhimail webmail">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bodhimail">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bodhimail</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="splash/style.css">
  <link rel="stylesheet" type="text/css" href="worker_service/style.css">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <script type="application/javascript" src="assets/packages/flutter_inappwebview_web/assets/web/web_support.js" defer></script>
  <script type="application/javascript" src="assets/packages/flutter_charset_detector_web/assets/web/jschardet.min.js" defer></script>
  <script src="worker_service/worker_service.js"></script>
  <script src="i18n/translater.js"></script>
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
  <!-- Load self-hosted Sentry SDK first, then the interceptor that blocks any subsequent
       CDN injection attempted by sentry_flutter at runtime. Order matters: interceptor
       must activate after the SDK bundle so window.Sentry is already populated. -->
  <script src="js/sentry-tracing.min.js?v=1.0.0"></script>
  <script src="js/sentry-interceptor.js?v=1.0.1"></script>
</head>
<body>

    <!-- Twake's Lottie splash and the Twake Workplace wordmark below it were
         both trademark-carrying and shown on every page load. Replaced with
         our own loading mark; the Workplace logo has no counterpart here and
         is simply gone, rather than swapped for something that would imply a
         product we do not ship. -->
    <div id="app-loading">
      <img src="splash/img/loading-logo.png" alt="Bodhimail">
    </div>

    <script>
      // The engine dispatches this once its first frame is painted, regardless
      // of bootstrap mode -- fade the loading state out then remove it, so
      // Flutter's own UI takes over cleanly underneath. Without this the
      // loading mark was never taken out of the document at all.
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 200);
      });
    </script>

    <div class="smart-banner">
        <button class="button close" onClick="closeSmartBanner()">
            <picture class="close-icon">
                <source srcset="worker_service/img/ic-close-1x.png 1x, worker_service/img/ic-close-2x.png 2x, worker_service/img/ic-close-3x.png 3x, worker_service/img/ic-close-4x.png 4x" media="(prefers-color-scheme: light)">
                <source srcset="worker_service/img/ic-close-1x.png 1x, worker_service/img/ic-close-2x.png 2x, worker_service/img/ic-close-3x.png 3x, worker_service/img/ic-close-4x.png 4x" media="(prefers-color-scheme: dark)">
                <img aria-hidden="true" src="worker_service/img/ic-close-1x.png" alt="">
            </picture>
        </button>
        <div class="banner-content">
            <picture class="twake-mail-icon">
                <source srcset="worker_service/img/tmail-1x.png 1x, worker_service/img/tmail-2x.png 2x, worker_service/img/tmail-3x.png 3x, worker_service/img/tmail-4x.png 4x" media="(prefers-color-scheme: light)">
                <source srcset="worker_service/img/tmail-1x.png 1x, worker_service/img/tmail-2x.png 2x, worker_service/img/tmail-3x.png 3x, worker_service/img/tmail-4x.png 4x" media="(prefers-color-scheme: dark)">
                <img aria-hidden="true" src="worker_service/img/tmail-1x.png" alt="">
            </picture>
            <span>
                <div class="banner-title" id="banner-title-id"></div>
                <div class="banner-description" id="banner-description-id"></div>
            </span>
            <span style="flex: 1"></span>
            <span class="open-button" id="open-button-id" onClick="openTwakeMailApp()"></span>
        </div>
    </div>

  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // Where the heavy build artefacts load from.
    //
    // The CI substitutes the token below with this build's immutable CDN
    // prefix; left unsubstituted (a local `flutter run`), the check falls
    // through and everything loads same-origin as usual.
    //
    // index.html itself always stays on the origin with a short TTL: it is
    // the pointer that names which CDN prefix to use, so caching it hard
    // would pin browsers to an old build permanently.
    var tmailCdnBase = "__CDN_BASE__";
    var tmailFlutterConfig = {};
    if (tmailCdnBase && tmailCdnBase.indexOf("__CDN") !== 0) {
      tmailFlutterConfig.assetBase = tmailCdnBase;
      tmailFlutterConfig.entryPointBaseUrl = tmailCdnBase;
      tmailFlutterConfig.canvasKitBaseUrl = tmailCdnBase + "canvaskit/";
    }

    loadLanguageResources().finally(initialTmailApp);

    if ('serviceWorker' in navigator) {
      navigator
        .serviceWorker
        .getRegistrations()
        .then(async function(registrations) {
          try {
            await Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          } catch (error) {
            console.log('[Twake Mail] Error unregistering service worker: ', error);
          }
          _flutter.loader.load({
            config: tmailFlutterConfig,
            onEntrypointLoaded: async function(engineInitializer) {
              const appRunner = await engineInitializer.initializeEngine({
                // fontFallbackBaseUrl is deliberately NOT set to ''.
                //
                // Empty pointed Flutter's automatic Noto fallback at our
                // own origin, which only worked because every fallback
                // font was bundled — and bundling them meant CanvasKit
                // downloaded all 21MB before painting a single frame. The
                // heavy scripts are no longer bundled (see pubspec.yaml),
                // so the default source is what makes CJK, emoji and maths
                // still render: fetched on demand, only for glyphs that
                // actually appear.
                //
                // assetBase has to be given to the *engine*, not only to
                // loader.load() above. That config governs the loader's own
                // fetches (main.dart.js, canvaskit); the engine resolves
                // everything under assets/ separately and without this
                // pulls it from the origin instead of the CDN edge.
                ...(tmailFlutterConfig.assetBase
                  ? { assetBase: tmailFlutterConfig.assetBase }
                  : {})
              });
              await appRunner.runApp();
            }
          });
        });
    } else {
      _flutter.loader.load({
        config: tmailFlutterConfig,
        onEntrypointLoaded: async function(engineInitializer) {
          // Same two decisions as the branch above: no
          // fontFallbackBaseUrl override (so heavy scripts load on demand
          // from Flutter's default source rather than being bundled), and
          // assetBase passed to the engine so assets come from the CDN.
          const appRunner = await engineInitializer.initializeEngine({
            ...(tmailFlutterConfig.assetBase
              ? { assetBase: tmailFlutterConfig.assetBase }
              : {})
          });
          await appRunner.runApp();
        }
      });
    }
  </script>
  <script src="https://unpkg.com/pica/dist/pica.min.js" ></script> 
</body>
</html>
